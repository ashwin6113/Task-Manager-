name: smart_task_manager
description: A production-grade Smart Task Manager Flutter application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.8.0
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.9.0
  logger: ^2.5.0

dev_dependencies:
  build_runner: ^2.4.14
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - environment/



